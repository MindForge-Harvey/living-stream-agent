server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    location = /__portal_check {
        internal;
        proxy_pass http://living-stream-backend:3001/chat/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location /chat/api/ {
        proxy_pass http://living-stream-backend:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://living-stream-backend:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /chat/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /chat/favicon.svg {
        alias /usr/share/nginx/html/favicon.svg;
    }
    location = / {
        return 302 /living-stream-agent/chat/;
    }
    location = /chat {
        return 302 /living-stream-agent/chat/;
    }
    location / {
        auth_request /__portal_check;
        error_page 401 = @portal_login;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
    location @portal_login {
        return 302 /api/auth/login?return_to=/living-stream-agent/chat/;
    }
}
