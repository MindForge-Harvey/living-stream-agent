    # BEGIN living-stream-agent
    location = /living-stream-agent {
        return 302 /living-stream-agent/chat/;
    }
    location ^~ /living-stream-agent/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $living_stream_frontend http://living-stream-frontend:80;
        rewrite ^/living-stream-agent(/.*)$ $1 break;
        proxy_pass $living_stream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    # END living-stream-agent
