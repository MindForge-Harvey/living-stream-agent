version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: living-stream-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-living_stream_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-living_stream_agent}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: living-stream-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mysql
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    ports:
      - "5172:3001"

  nginx:
    image: nginx:alpine
    container_name: living-stream-nginx
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  mysql_data:
