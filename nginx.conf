server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # API 反代到后端
    location /chat/api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 静态资源（alias：/chat/assets/* -> html/assets/*，不存在文件自动 404）
    # 注意：不要在此与 try_files 混用（alias+try_files 会导致文件服务 404）
    location /chat/assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    # favicon（index.html 以 /chat/favicon.svg 引用）
    location = /chat/favicon.svg {
        alias /usr/share/nginx/html/favicon.svg;
    }

    # SPA 路由回退（/chat 下的所有前端路由）
    location = /chat {
        return 301 /chat/;
    }

    location /chat/ {
        try_files $uri $uri/ /index.html;
    }

    # 根路径
    location = / {
        return 302 /chat/;
    }

    # superlogin / superconfig 等 SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
