services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: living-stream-backend
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: living-stream-frontend
    restart: unless-stopped
    ports:
      - "5172:80"
    depends_on:
      - backend
